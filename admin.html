<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administració - Rotaract</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #123;
    }

    header {
      background: #0b4d3e;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    h2,
    h3 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 15px;
      background: #0b4d3e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin: 3px;
    }

    button:hover {
      opacity: 0.9;
    }

    .danger {
      background: #c0392b;
    }

    .secondary {
      background: #e9efec;
      color: #0b4d3e;
    }

    .success {
      background: #16846a;
    }

    .hidden {
      display: none !important;
    }

    .login {
      max-width: 420px;
      margin: 70px auto;
    }

    .meeting-row,
    .member-row {
      border-bottom: 1px solid #eee;
      padding: 16px 0;
    }

    .meeting-row:last-child,
    .member-row:last-child {
      border-bottom: none;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .small {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      background: #dcefe8;
      color: #0b4d3e;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .attendee-list {
      background: #f7f9f8;
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .attendee {
      padding: 7px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .attendee:last-child {
      border-bottom: none;
    }

    .empty {
      color: #777;
      padding: 10px 0;
    }

    .top-actions {
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .row-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ROTARACT · ADMIN</h1>
  <a href="index.html">← Tornar a la web</a>
</header>

<!-- LOGIN -->

<div id="loginSection" class="login card">

  <h2>🔐 Administració</h2>

  <p class="small">
    Inicia sessió per gestionar les reunions i els membres.
  </p>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Contrasenya"
  >

  <button onclick="login()">
    Entrar
  </button>

  <p id="loginError" style="color:#c0392b;"></p>

</div>

<!-- ADMIN -->

<main id="adminSection" class="hidden">

  <div class="top-actions">
    <button class="secondary" onclick="logout()">
      Tancar sessió
    </button>
  </div>

  <!-- REUNIÓ ACTIVA -->

  <section class="card">

    <h2>🟢 Reunió activa</h2>

    <div id="activeMeeting"></div>

    <hr>

    <h3>Crear nova reunió</h3>

    <input
      type="date"
      id="meetingDateInput"
    >

    <button onclick="createMeeting()">
      Crear reunió
    </button>

    <button
      id="closeMeetingButton"
      class="danger hidden"
      onclick="closeActiveMeeting()"
    >
      Tancar reunió activa
    </button>

  </section>

  <!-- HISTORIAL -->

  <section class="card">

    <h2>📅 Historial de reunions</h2>

    <p class="small">
      Aquí pots veure qui va assistir a cada reunió.
    </p>

    <div id="meetingsList"></div>

  </section>

  <!-- MEMBRES -->

  <section class="card">

    <h2>👥 Membres</h2>

    <input
      type="text"
      id="newMemberName"
      placeholder="Nom del nou membre"
    >

    <button onclick="addMember()">
      Afegir membre
    </button>

    <div id="membersList"></div>

  </section>

</main>

<script>

  const SUPABASE_URL =
    "https://ocyzergjotoobbtezxuw.supabase.co";

  // PEGA AQUÍ LA TEVA PUBLISHABLE KEY
  const SUPABASE_ANON_KEY =
    "PEGA_AQUI_TU_PUBLISHABLE_KEY";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  let members = [];
  let meetings = [];
  let attendance = [];

  async function checkSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
      showAdmin();
    } else {
      showLogin();
    }
  }

  function showLogin() {
    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    document
      .getElementById("adminSection")
      .classList.add("hidden");
  }

  function showAdmin() {
    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminSection")
      .classList.remove("hidden");

    loadAdminData();
  }

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const {
      error
    } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      document.getElementById("loginError").textContent =
        "Email o contrasenya incorrectes.";
      return;
    }

    document.getElementById("loginError").textContent = "";

    showAdmin();
  }

  async function logout() {

    await supabaseClient.auth.signOut();

    showLogin();
  }

  async function loadAdminData() {

    const [
      membersResponse,
      meetingsResponse,
      attendanceResponse
    ] = await Promise.all([

      supabaseClient
        .from("members")
        .select("*")
        .order("name"),

      supabaseClient
        .from("meetings")
        .select("*")
        .order("date", {
          ascending: false
        }),

      supabaseClient
        .from("attendance")
        .select("*")
    ]);

    if (membersResponse.error) {
      console.error(membersResponse.error);
      return;
    }

    if (meetingsResponse.error) {
      console.error(meetingsResponse.error);
      return;
    }

    if (attendanceResponse.error) {
      console.error(attendanceResponse.error);
      return;
    }

    members = membersResponse.data || [];
    meetings = meetingsResponse.data || [];
    attendance = attendanceResponse.data || [];

    renderActiveMeeting();
    renderMeetings();
    renderMembers();
  }

  function formatDate(dateString) {

    const date =
      new Date(dateString + "T00:00:00");

    return date.toLocaleDateString(
      "ca-ES",
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );
  }

  function renderActiveMeeting() {

    const container =
      document.getElementById("activeMeeting");

    const active =
      meetings.find(
        meeting => meeting.active === true
      );

    const closeButton =
      document.getElementById("closeMeetingButton");

    if (!active) {

      container.innerHTML =
        `<p class="empty">No hi ha cap reunió activa.</p>`;

      closeButton.classList.add("hidden");

      return;
    }

    const count =
      attendance.filter(
        a => a.meeting_id === active.id
      ).length;

    container.innerHTML = `
      <strong>${formatDate(active.date)}</strong>
      <div class="small">
        ${count} persones han fet check-in
      </div>
    `;

    closeButton.classList.remove("hidden");
  }

  async function createMeeting() {

    const date =
      document.getElementById("meetingDateInput").value;

    if (!date) {
      alert("Selecciona una data.");
      return;
    }

    // Primer tanquem qualsevol reunió activa.

    const {
      error: closeError
    } = await supabaseClient
      .from("meetings")
      .update({
        active: false
      })
      .eq("active", true);

    if (closeError) {
      console.error(closeError);
      alert("No s'ha pogut actualitzar la reunió activa.");
      return;
    }

    // Creem la nova.

    const {
      error
    } = await supabaseClient
      .from("meetings")
      .insert({
        date,
        active: true
      });

    if (error) {
      console.error(error);
      alert("No s'ha pogut crear la reunió.");
      return;
    }

    document.getElementById(
      "meetingDateInput"
    ).value = "";

    await loadAdminData();
  }

  async function closeActiveMeeting() {

    const active =
      meetings.find(
        meeting => meeting.active === true
      );

    if (!active) return;

    const confirmed =
      confirm(
        "Vols tancar aquesta reunió? Els check-ins es conservaran."
      );

    if (!confirmed) return;

    const {
      error
    } = await supabaseClient
      .from("meetings")
      .update({
        active: false
      })
      .eq("id", active.id);

    if (error) {
      console.error(error);
      alert("No s'ha pogut tancar la reunió.");
      return;
    }

    await loadAdminData();
  }

  function renderMeetings() {

    const container =
      document.getElementById("meetingsList");

    container.innerHTML = "";

    if (meetings.length === 0) {
      container.innerHTML =
        `<p class="empty">Encara no hi ha reunions.</p>`;
      return;
    }

    meetings.forEach(meeting => {

      const count =
        attendance.filter(
          a => a.meeting_id === meeting.id
        ).length;

      const row =
        document.createElement("div");

      row.className = "meeting-row";

      row.innerHTML = `
        <div class="row-top">

          <div>
            <strong>
              ${formatDate(meeting.date)}
            </strong>

            <div class="small">
              ${count} persones han fet check-in
            </div>

            ${
              meeting.active
                ? `<span class="badge">ACTIVA</span>`
                : ""
            }
          </div>

          <div>

            <button
              class="secondary"
              onclick="toggleAttendees('${meeting.id}')"
            >
              👥 Veure assistents
            </button>

            <button
              class="danger"
              onclick="deleteMeeting('${meeting.id}')"
            >
              🗑️ Esborrar
            </button>

          </div>

        </div>

        <div
          id="attendees-${meeting.id}"
          class="attendee-list hidden"
        ></div>
      `;

      container.appendChild(row);
    });
  }

  function toggleAttendees(meetingId) {

    const container =
      document.getElementById(
        `attendees-${meetingId}`
      );

    if (!container.classList.contains("hidden")) {

      container.classList.add("hidden");

      return;
    }

    const meetingAttendance =
      attendance.filter(
        a => a.meeting_id === meetingId
      );

    const attendeeIds =
      meetingAttendance.map(
        a => a.member_id
      );

    const attendees =
      members
        .filter(member =>
          attendeeIds.includes(member.id)
        )
        .sort((a, b) =>
          a.name.localeCompare(b.name)
        );

    if (attendees.length === 0) {

      container.innerHTML =
        `<div class="empty">
          Ningú ha fet check-in en aquesta reunió.
        </div>`;

    } else {

      container.innerHTML =
        `<strong>
          ${attendees.length} assistents
        </strong>` +
        attendees
          .map(member =>
            `<div class="attendee">
              ✓ ${escapeHtml(member.name)}
            </div>`
          )
          .join("");
    }

    container.classList.remove("hidden");
  }

  async function deleteMeeting(meetingId) {

    const meeting =
      meetings.find(
        m => m.id === meetingId
      );

    if (!meeting) return;

    if (meeting.active) {
      alert(
        "No pots esborrar una reunió activa. Tanca-la primer."
      );
      return;
    }

    const confirmed =
      confirm(
        `Vols esborrar la reunió del ${formatDate(meeting.date)}?\n\n` +
        "També s'eliminaran els seus check-ins."
      );

    if (!confirmed) return;

    // Primer eliminem les assistències.

    const {
      error: attendanceError
    } = await supabaseClient
      .from("attendance")
      .delete()
      .eq("meeting_id", meetingId);

    if (attendanceError) {
      console.error(attendanceError);
      alert("No s'han pogut eliminar els check-ins.");
      return;
    }

    // Després eliminem la reunió.

    const {
      error
    } = await supabaseClient
      .from("meetings")
      .delete()
      .eq("id", meetingId);

    if (error) {
      console.error(error);
      alert("No s'ha pogut eliminar la reunió.");
      return;
    }

    await loadAdminData();
  }

  async function addMember() {

    const input =
      document.getElementById("newMemberName");

    const name =
      input.value.trim();

    if (!name) {
      alert("Escriu un nom.");
      return;
    }

    const {
      error
    } = await supabaseClient
      .from("members")
      .insert({
        name,
        active: true
      });

    if (error) {
      console.error(error);
      alert("No s'ha pogut afegir el membre.");
      return;
    }

    input.value = "";

    await loadAdminData();
  }

  function renderMembers() {

    const container =
      document.getElementById("membersList");

    container.innerHTML = "";

    if (members.length === 0) {
      container.innerHTML =
        `<p class="empty">No hi ha membres.</p>`;
      return;
    }

    members.forEach(member => {

      const row =
        document.createElement("div");

      row.className = "member-row";

      row.innerHTML = `
        <div class="row-top">

          <div>
            <strong>
              ${escapeHtml(member.name)}
            </strong>

            <div class="small">
              Membre actiu
            </div>
          </div>

          <button
            class="danger"
            onclick="deleteMember('${member.id}')"
          >
            🗑️ Borrar
          </button>

        </div>
      `;

      container.appendChild(row);
    });
  }

  async function deleteMember(memberId) {

    const member =
      members.find(
        m => m.id === memberId
      );

    if (!member) return;

    const confirmed =
      confirm(
        `Vols borrar definitivament a ${member.name}?\n\n` +
        "El membre desapareixerà de la llista i també s'eliminaran els seus registres d'assistència."
      );

    if (!confirmed) return;

    // Eliminem primer els seus check-ins.

    const {
      error: attendanceError
    } = await supabaseClient
      .from("attendance")
      .delete()
      .eq("member_id", memberId);

    if (attendanceError) {
      console.error(attendanceError);
      alert(
        "No s'han pogut eliminar els registres d'assistència."
      );
      return;
    }

    // Després eliminem el membre.

    const {
      error
    } = await supabaseClient
      .from("members")
      .delete()
      .eq("id", memberId);

    if (error) {
      console.error(error);
      alert("No s'ha pogut borrar el membre.");
      return;
    }

    await loadAdminData();
  }

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }

  checkSession();

</script>

</body>
</html>
